name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost lightgbm h3 structlog scipy shap pytest pytest-asyncio httpx pydantic pydantic-settings pyyaml
      - name: Run unit tests
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/unit/ -v --tb=short
      - name: Run integration tests
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/integration/ -v --tb=short -k "not test_root_health" || true
