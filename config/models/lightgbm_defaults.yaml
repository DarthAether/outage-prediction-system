model_type: lightgbm
params:
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 500
  num_leaves: 63
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  scale_pos_weight: 3.0
  objective: binary
  metric: auc
  boosting_type: gbdt
  is_unbalance: false
  verbose: -1
  random_state: 42
